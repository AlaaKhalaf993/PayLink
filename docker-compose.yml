services:
  postgres:
    image: postgres:17
    container_name: paylink-db
    environment:
      POSTGRES_DB: paylink
      POSTGRES_USER: paylink_user
      POSTGRES_PASSWORD: paylink_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U paylink_user -d paylink" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: paylink-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paylink
      SPRING_DATASOURCE_USERNAME: paylink_user
      SPRING_DATASOURCE_PASSWORD: paylink_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
