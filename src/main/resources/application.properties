spring.application.name=paylink

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paylink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paylink_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:paylink_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
